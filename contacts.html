<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacts</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
<div class="home">
    <div class="dropdown">
        <button class="dropbtn">Contact Me</button>
        <div class="home-content">
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="Accomplish.html">Accomplishments</a>
        </div>
    </div>
</div>

<div class="container">
    <div class="contact-info">
        <p>Location: Atlanta, GA</p>
    </div>

    <div class="contact-form">
        <form id="contactForm" onsubmit="return sendEmail(event)">
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname" name="firstname" required>

            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" required>

            <label for="Phone_Number">Phone Number:</label>
            <input type="text" id="Phone_Number" name="Phone_Number" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <div class="social-media">
        <a href="https://www.linkedin.com/in/donye-richardson-65a8b2212/" target="_blank">LinkedIn</a>
        <a href="https://github.com/donyerichardson" target="_blank">GitHub</a>
    </div>
</div>

<h5>by Donye Richardson</h5>

<script>
    function sendEmail(event) {
        event.preventDefault(); // Prevent form submission

        const firstname = document.getElementById('firstname').value;
        const lastname = document.getElementById('lastname').value;
        const phone = document.getElementById('Phone_Number').value;
        const email = document.getElementById('email').value;
        const message = document.getElementById('message').value;

        const subject = "Website Design Request from " + firstname +" "+ lastname;
        const body = `Hello,

My name is ${firstname} ${lastname}.
You can reach me at ${phone}.

My email address is ${email}.

Message:
${message}`;

        // Open the default email client
        window.location.href = `mailto:donyerichardson@icloud.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}&from=${encodeURIComponent(email)}`;

        // Optionally reset the form after sending the email
        document.getElementById('contactForm').reset();
    }
</script>
</body>
</html>
